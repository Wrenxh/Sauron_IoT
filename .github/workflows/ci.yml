name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. This MUST come first to download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python and cache dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # We will temporarily remove 'cache' to ensure a clean install
          # cache: "pip"

      # 3. Install your requirements
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # We use './' to tell GitHub the file is in the root folder
          pip install -r ./requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q